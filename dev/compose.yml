name: walkingtour-historic-dev
services:
  web:
    build: .
    environment:
      WALKINGTOUR_DEV: "1"
      APPLICATION_ENV: development
    ports:
      - "127.0.0.1:8098:80"
    volumes:
      - ..:/var/www/html/plugins/WalkingTour:ro
    depends_on:
      db:
        condition: service_healthy
  db:
    image: mariadb:10.11
    environment:
      MARIADB_RANDOM_ROOT_PASSWORD: "yes"
      MARIADB_DATABASE: omeka
      MARIADB_USER: omeka
      MARIADB_PASSWORD: local-development-only
    volumes:
      - database:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 3s
      timeout: 3s
      retries: 30
volumes:
  database:
